name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Accept all Android licenses (force)
        run: |
          mkdir -p $ANDROID_HOME/licenses
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_HOME/licenses/android-sdk-license
          echo -e "\n84831b940964496ad9267ff4d6e4b4d6" > $ANDROID_HOME/licenses/android-sdk-preview-license
          echo -e "\n994b2c67b605f9aabe1d1747a85e83f1" > $ANDROID_HOME/licenses/android-sdk-arm-dbt-license
          echo -e "\n33b6a2b64607f11b759f320ef9dff4ae" > $ANDROID_HOME/licenses/google-gdk-license
          echo -e "\nd56f5187479451eabf01fb78af6dfcb6" > $ANDROID_HOME/licenses/android-googletv-license
          echo -e "\n601085b94cd77f0b54ff86406957099e" > $ANDROID_HOME/licenses/android-sdk-preview-license
          yes | sdkmanager --licenses || true

      - name: Install required SDK packages
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Create Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.5

      - name: Build Debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FootballApp-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
